# nginx site for the PM2 deployment: TLS, one domain, path routing to the three HTTP processes
# (listening on 127.0.0.1, see ecosystem.config.cjs). Works with the nginx of Ubuntu 22.04 / 24.04.
#
# Do not install it by hand: `sudo deploy/vps/setup-nginx.sh api.example.com you@example.com`
# installs nginx and certbot, gets the certificate, fills in the domain and ports, and sets up
# renewal. Guide: docs/architecture/deployment.md#vps-with-pm2

upstream app_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream app_graphql {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream app_socket {
    # WebSocket-only Socket.IO (no long-polling): no sticky sessions needed. PM2 cluster mode
    # spreads connections over the socket processes behind this one port.
    server 127.0.0.1:3001;
}

# WebSocket upgrade when asked for; otherwise an empty Connection header keeps upstream keep-alive.
map $http_upgrade $app_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen … ssl http2` rather than `http2 on`: the latter needs nginx 1.25.1, Ubuntu 24.04 ships 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # HSTS and the other security headers come from the app (helmet), not from here.

    # Same as BODY_LIMIT (files go to S3 through presigned URLs, never through here).
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # One proxy hop in front of the app: TRUST_PROXY=1 reads the client IP nginx appends.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $app_connection_upgrade;

    # REST, health, Stripe webhook. Above REQUEST_TIMEOUT_UPLOAD_MS (120 s): the app answers first.
    location /api/ {
        proxy_pass http://app_api;
        proxy_read_timeout 125s;
    }

    # Queries and graphql-ws subscriptions (long-lived).
    location = /graphql {
        proxy_pass http://app_graphql;
        proxy_read_timeout 1h;
    }

    # Socket.IO over WebSocket. Pings every 25 s keep the connection alive.
    location /socket.io/ {
        proxy_pass http://app_socket;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
